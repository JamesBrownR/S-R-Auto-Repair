<style>
  /* --- Variables & Reset --- */
  :root {
    --primary-red: #A63429; /* Roof Color */
    --primary-tan: #EBE5CE; /* Sign Background */
    --accent-brown: #4A3B32; /* Dark Text */
    --text-dark: #333333;
    --text-light: #ffffff;
    --light-gray: #f4f4f4;
    --shadow: 0 4px 6px rgba(0,0,0,0.1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    color: var(--text-dark);
    line-height: 1.6;
    background-color: #fff;
  }

  h1, h2, h3, h4 {
    font-family: 'Impact', 'Arial Narrow', sans-serif;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--accent-brown);
  }

  a { text-decoration: none; transition: 0.3s; }
  ul { list-style: none; }

  .container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 20px;
  }

  /* --- Buttons --- */
  .btn {
    display: inline-block;
    padding: 12px 30px;
    background: var(--primary-red);
    color: var(--text-light);
    font-weight: bold;
    border-radius: 4px;
    border: 2px solid var(--primary-red);
    text-transform: uppercase;
    cursor: pointer;
  }
  .btn:hover { background: transparent; color: var(--primary-red); }
  
  .btn-outline {
    background: transparent;
    border: 2px solid var(--accent-brown);
    color: var(--accent-brown);
  }
  .btn-outline:hover { background: var(--accent-brown); color: var(--text-light); }

  /* --- Header --- */
  header {
    background: var(--accent-brown);
    color: var(--text-light);
    padding: 1rem 0;
    border-bottom: 5px solid var(--primary-red);
    position: sticky;
    top: 0;
    z-index: 1000;
  }
  nav { display: flex; justify-content: space-between; align-items: center; }
  .logo { font-size: 1.5rem; font-weight: bold; color: var(--primary-tan); }
  .nav-links a { color: var(--text-light); margin-left: 20px; font-weight: bold; font-size: 0.9rem;}
  .nav-links a:hover { color: var(--primary-tan); }

  /* --- Hero --- */
  .hero {
    background-color: var(--primary-tan);
    text-align: center;
    padding: 100px 20px;
    background-image: linear-gradient(rgba(235, 229, 206, 0.9), rgba(235, 229, 206, 0.9)), url('path/to/shop-bg.jpg'); /* Optional bg image */
    background-size: cover;
  }
  .hero h1 { font-size: 3.5rem; color: var(--primary-red); margin-bottom: 15px; }
  .hero p { font-size: 1.3rem; margin-bottom: 30px; font-weight: bold; color: var(--accent-brown);}

  /* --- Stats Bar --- */
  .stats-bar {
    background: var(--accent-brown);
    color: var(--primary-tan);
    display: flex;
    justify-content: space-around;
    padding: 25px 20px;
    text-align: center;
    flex-wrap: wrap;
  }
  .stat-item { margin: 10px; }
  .stat-number { font-size: 2.2rem; font-weight: bold; display: block; color: var(--text-light); }
  .stat-label { text-transform: uppercase; font-size: 0.9rem; letter-spacing: 1px; }

  /* --- Common Section --- */
  .section { padding: 80px 0; }
  .section-title { text-align: center; margin-bottom: 50px; font-size: 2.5rem; }
  .bg-light { background-color: var(--light-gray); }

  /* --- Services Grid --- */
  .services-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 30px;
  }
  .service-card {
    background: white;
    padding: 40px 30px;
    text-align: center;
    border-bottom: 4px solid var(--primary-red);
    box-shadow: var(--shadow);
    transition: transform 0.3s ease;
  }
  .service-card:hover { transform: translateY(-5px); }
  .service-icon {
    font-size: 3rem;
    color: var(--primary-red);
    margin-bottom: 20px;
  }
  .service-card h3 { margin-bottom: 15px; font-size: 1.4rem; }
  .service-card p { color: #666; font-size: 0.95rem; }

  /* --- Reviews --- */
  .review-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 30px;
  }
  .review-card {
    background: white;
    padding: 30px;
    border-radius: 8px;
    border: 1px solid #eee;
    box-shadow: 0 2px 5px rgba(0,0,0,0.05);
  }
  .stars { color: #f1c40f; margin-bottom: 15px; }
  .review-text { font-style: italic; color: #555; margin-bottom: 20px; display: block; }
  .review-author { font-weight: bold; color: var(--accent-brown); display: flex; justify-content: space-between; align-items: center; }
  .review-date { font-size: 0.8rem; color: #999; font-weight: normal; }

  /* --- Contact --- */
  .contact-wrapper { display: flex; flex-wrap: wrap; gap: 50px; }
  .contact-info, .contact-form-container { flex: 1; min-width: 300px; }
  
  .hours-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
  .hours-table td { padding: 12px 0; border-bottom: 1px solid #ddd; }
  .hours-table td:last-child { text-align: right; font-weight: bold; }

  form input, form textarea {
    width: 100%; padding: 15px; margin-bottom: 15px;
    border: 1px solid #ccc; border-radius: 4px; font-family: inherit;
  }

  /* --- Footer --- */
  footer {
    background: var(--text-dark);
    color: #aaa;
    text-align: center;
    padding: 50px 0;
    font-size: 0.9rem;
  }
  
  @media (max-width: 768px) {
    .hero h1 { font-size: 2.5rem; }
    nav { flex-direction: column; }
    .nav-links { margin-top: 15px; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;}
    .nav-links a { margin: 0; }
  }
</style>
