<style>
  /* --- Variables & Reset --- */
  :root {
    --primary-red: #A63429; /* Matches the roof */
    --primary-tan: #EBE5CE; /* Matches the sign background */
    --accent-brown: #4A3B32; /* Matches the dark text */
    --text-dark: #333333;
    --text-light: #ffffff;
    --success-green: #2ecc71;
    --shadow: 0 4px 6px rgba(0,0,0,0.1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    color: var(--text-dark);
    line-height: 1.6;
    background-color: #f9f9f9;
  }

  h1, h2, h3 {
    font-family: 'Impact', 'Arial Narrow', sans-serif; /* Strong, shop-sign style font */
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--accent-brown);
  }

  a { text-decoration: none; transition: 0.3s; }
  ul { list-style: none; }

  /* --- Layout Utilities --- */
  .container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 20px;
  }

  .btn {
    display: inline-block;
    padding: 12px 30px;
    background: var(--primary-red);
    color: var(--text-light);
    font-weight: bold;
    border-radius: 4px;
    border: 2px solid var(--primary-red);
    text-transform: uppercase;
  }

  .btn:hover {
    background: transparent;
    color: var(--primary-red);
  }

  /* --- Header & Nav --- */
  header {
    background: var(--accent-brown);
    color: var(--text-light);
    padding: 1rem 0;
    border-bottom: 5px solid var(--primary-red);
  }

  nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .logo { font-size: 1.5rem; font-weight: bold; color: var(--primary-tan); }
  
  .nav-links a {
    color: var(--text-light);
    margin-left: 20px;
    font-weight: bold;
  }
  
  .nav-links a:hover { color: var(--primary-tan); }

  /* --- Hero Section --- */
  .hero {
    background-color: var(--primary-tan);
    text-align: center;
    padding: 80px 20px;
    border-bottom: 1px solid #ddd;
  }

  .hero h1 {
    font-size: 3.5rem;
    color: var(--primary-red);
    margin-bottom: 10px;
  }

  .hero p { font-size: 1.2rem; margin-bottom: 30px; font-weight: bold; color: var(--accent-brown);}

  /* --- Stats Bar --- */
  .stats-bar {
    background: var(--accent-brown);
    color: var(--primary-tan);
    display: flex;
    justify-content: space-around;
    padding: 20px;
    flex-wrap: wrap;
    text-align: center;
  }
  .stat-item { margin: 10px; }
  .stat-number { font-size: 2rem; font-weight: bold; display: block; color: var(--text-light); }

  /* --- Section Styling --- */
  .section { padding: 60px 0; }
  .section-title { text-align: center; margin-bottom: 40px; font-size: 2.5rem; }

  /* --- Reviews (Grid) --- */
  .reviews-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 30px;
  }

  .review-card {
    background: white;
    padding: 30px;
    border-radius: 8px;
    box-shadow: var(--shadow);
    border-top: 5px solid var(--primary-red);
  }

  .stars { color: #f1c40f; margin-bottom: 10px; }
  .review-author { font-weight: bold; margin-top: 15px; display: block; text-align: right; color: var(--accent-brown);}

  /* --- Contact & Map --- */
  .contact-wrapper {
    display: flex;
    flex-wrap: wrap;
    gap: 40px;
  }

  .contact-info, .contact-form-container { flex: 1; min-width: 300px; }
  
  .hours-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
  .hours-table tr { border-bottom: 1px solid #eee; }
  .hours-table td { padding: 10px 0; }
  .hours-table td:last-child { text-align: right; font-weight: bold; }

  /* --- Form --- */
  form input, form textarea {
    width: 100%;
    padding: 15px;
    margin-bottom: 15px;
    border: 1px solid #ddd;
    border-radius: 4px;
    font-family: inherit;
  }

  /* --- Footer --- */
  footer {
    background: var(--text-dark);
    color: #888;
    text-align: center;
    padding: 40px 0;
    margin-top: 60px;
  }
  footer p { margin-bottom: 10px; }

  /* --- Mobile --- */
  @media (max-width: 768px) {
    .hero h1 { font-size: 2.5rem; }
    nav { flex-direction: column; }
    .nav-links { margin-top: 15px; }
    .nav-links a { margin: 0 10px; }
  }
</style>
