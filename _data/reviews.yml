reviews:
  - name: "Kenni Defreitas"
    stars: 5
    text: "I had just purchased a 2008 Land Rover Range Rover Sport HSE model, and could not get the heat to work. Took it up to Justin at 9:00, and he had the heat working by 2:00. Very happy with the results and the service. I would recommend S&R Auto Repair anytime to anyone."

  - name: "Carol Horner"
    stars: 5
    text: "I was traveling and had a brake problem. Stopped at S&R Auto Repair. They fixed my Jeep right away. The guys were wonderful and friendly. I would recommend them hands down."

  - name: "Jessica Grosso"
    stars: 5
    text: "Trevor is a great mechanic. After three other shops misdiagnosed my 2010 F150, he properly identified the transmission issue and fixed it. Honest, reliable, and patient."

  - name: "Tyler Hyrons"
    stars: 5
    text: "Trevor is awesome! Great crew and quality work for a fair price."

  - name: "Debra Woodford"
    stars: 5
    text: "Amazing shop. Trevor scanned the issue the next day, found a bad coil, had the part delivered in minutes, and fixed it quickly. Excellent, friendly, affordable service."

  - name: "alisa flow"
    stars: 5
    text: "Trevor is experienced and honest. He explains exactly what is wrong and doesn’t charge for unnecessary repairs. Highly recommend."

  - name: "Ginger Borase"
    stars: 5
    text: "My 2016 Kia had a grinding noise. Trevor quickly identified brake pads as the issue and fixed it the same day at a reasonable cost."

  - name: "savant"
    stars: 5
    text: "Dealer quoted $900+ for my Camaro A/C. Trevor diagnosed it in minutes, fixed it for $75 in parts, and even repaired a coolant leak. Extremely honest mechanic."

  - name: "Landy Vega"
    stars: 5
    text: "Elijah kept me updated constantly and even offered to FaceTime repairs. Honest and reliable service."

  - name: "Jim Brady"
